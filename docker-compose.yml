# Local development database only — NOT a production configuration.
# Credentials are read from the untracked `.env` file (see `.env.example`).
# No hardcoded or default credentials are committed (CWE-798, CIS PostgreSQL).
# The `:?` guards make `docker compose` fail fast if a value is missing.
services:
  db:
    image: postgres:17-alpine
    container_name: second-brain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # Bind to loopback only — the dev DB is never exposed on the LAN.
      # Host port is overridable (default 5432) to avoid clashing with a
      # locally-installed Postgres; the container port stays 5432.
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
